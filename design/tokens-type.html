<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>Typografi</title>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./frame.css">
</head>
<body>

<div class="ds-tokens">
  <h2 style="font-size:28px">Typografi</h2>
  
  <div class="ds-type-row">
    <span class="ds-type-row__label">clue__prompt · 84px</span>
    <span style="font-family:var(--font-display);font-size:56px">Hvilken by?</span>
  </div>
  <div class="ds-type-row">
    <span class="ds-type-row__label">board__tile · 86px</span>
    <span style="font-family:var(--font-display);font-size:56px;color:var(--gold-bright)">400</span>
  </div>
  <div class="ds-type-row">
    <span class="ds-type-row__label">board__category · 34px</span>

  </div>
  <div class="ds-type-row">
    <span class="ds-type-row__label">score-strip__score · 58px</span>
    <span style="font-family:var(--font-display);font-size:40px">1200</span>
  </div>
  <div class="ds-type-row">
    <span class="ds-type-row__label">host · 18px</span>
    <span style="font-size:18px">Vertspult, én hånd</span>
  </div>
  <div class="ds-type-row">
    <span class="ds-type-row__label">muted · 14px</span>
