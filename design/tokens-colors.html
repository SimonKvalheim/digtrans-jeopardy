<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>Farger</title>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./frame.css">
</head>
<body>

<div class="ds-tokens">
  <h2 style="font-size:28px">Farger</h2>
  <div class="ds-swatches">
    
    <div class="ds-swatch">
      <div class="ds-swatch__chip" style="background:#060ce9"></div>
      <div class="ds-swatch__meta">
        <span class="ds-swatch__name">Merkevaren</span>
        <span class="ds-swatch__value">--jeopardy-blue<br>#060ce9</span>
      </div>
    </div>
    <div class="ds-swatch">
      <div class="ds-swatch__chip" style="background:#0b1064"></div>
      <div class="ds-swatch__meta">
        <span class="ds-swatch__name">Bak rutenettet</span>
        <span class="ds-swatch__value">--board-bg<br>#0b1064</span>
      </div>
    </div>
    <div class="ds-swatch">
      <div class="ds-swatch__chip" style="background:#060ce9"></div>
      <div class="ds-swatch__meta">
        <span class="ds-swatch__name">Ubrukt rute</span>
        <span class="ds-swatch__value">--tile-bg<br>#060ce9</span>
      </div>
    </div>
    <div class="ds-swatch">
      <div class="ds-swatch__chip" style="background:#030747"></div>
      <div class="ds-swatch__meta">
        <span class="ds-swatch__name">Brukt rute</span>
        <span class="ds-swatch__value">--tile-bg-spent<br>#030747</span>
      </div>
    </div>
    <div class="ds-swatch">
      <div class="ds-swatch__chip" style="background:#d69f4c"></div>
      <div class="ds-swatch__meta">
        <span class="ds-swatch__name">Kategorier, dempet</span>
        <span class="ds-swatch__value">--gold<br>#d69f4c</span>
      </div>
    </div>
    <div class="ds-swatch">
      <div class="ds-swatch__chip" style="background:#ffcc00"></div>
      <div class="ds-swatch__meta">
        <span class="ds-swatch__name">Poeng og nedtelling</span>
        <span class="ds-swatch__value">--gold-bright<br>#ffcc00</span>
      </div>
    </div>
    <div class="ds-swatch">
      <div class="ds-swatch__chip" style="background:#b9bfe8"></div>
      <div class="ds-swatch__meta">
        <span class="ds-swatch__name">Sekundær tekst</span>
        <span class="ds-swatch__value">--ink-dim<br>#b9bfe8</span>
      </div>
    </div>
    <div class="ds-swatch">
      <div class="ds-swatch__chip" style="background:#ff5a5a"></div>
      <div class="ds-swatch__meta">
        <span class="ds-swatch__name">Minuspoeng</span>
        <span class="ds-swatch__value">--negative<br>#ff5a5a</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
