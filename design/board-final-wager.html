<!-- @dsCard group="Brett" -->
<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>Final — innsats</title>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./frame.css">
</head>
<body>
<div class="ds-frame ds-frame--board"><div class="stage"><div class="board">
  <div class="final">
    <h1 class="final__title">Final Jeopardy</h1>
    <p class="final__blind">Ingen kategori. Ingen hint. Satse blindt.</p>
    <div class="final__locks">
      <div class="final__lock final__lock--done"><span>Fadderbarna</span><strong>Låst</strong></div>
      <div class="final__lock"><span>Kollektivet</span><strong>Satser…</strong></div>
      <div class="final__lock final__lock--done"><span>Kalinka</span><strong>Låst</strong></div>
    </div>
    <p class="final__out">Ute av finalen: Team Bortistu · Siste Skanse — null eller under.</p>
  </div>
  
<div class="score-strip">
  
  <div class="score-strip__team score-strip__team--turn">
    <div class="score-strip__name">Fadderbarna</div>
    <div class="score-strip__score">1200</div>
  </div>
  <div class="score-strip__team">
    <div class="score-strip__name">Kollektivet</div>
    <div class="score-strip__score">800</div>
  </div>
  <div class="score-strip__team">
    <div class="score-strip__name">Team Bortistu</div>
    <div class="score-strip__score score-strip__score--negative">-300</div>
  </div>
  <div class="score-strip__team">
    <div class="score-strip__name">Kalinka</div>
    <div class="score-strip__score">400</div>
  </div>
  <div class="score-strip__team">
    <div class="score-strip__name">Siste Skanse</div>
    <div class="score-strip__score">0</div>
  </div>
</div>
</div></div></div>
</body>
</html>
