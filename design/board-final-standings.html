<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>Final — stillingen</title>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./frame.css">
</head>
<body>
<div class="ds-frame ds-frame--board"><div class="stage"><div class="board">
  <div class="final">
    <h1 class="final__title">Stillingen</h1>
    <p class="final__prompt-small">Hvilket tegn valgte han?</p>
    <div class="final__reveals">
      <div class="final__reveal final__reveal--correct">
        <span class="final__reveal-team">Fadderbarna</span>
        <span class="final__reveal-answer">Alfakrøll</span>
        <span class="final__reveal-wager">+1200</span>
        <span class="final__reveal-score">2400</span>
      </div>
      <div class="final__reveal final__reveal--wrong">
        <span class="final__reveal-team">Kalinka</span>
        <span class="final__reveal-answer">Ampersand</span>
        <span class="final__reveal-wager">−400</span>
        <span class="final__reveal-score">0</span>
      </div>
    </div>
  </div>
  
<div class="score-strip">
  
  <div class="score-strip__team score-strip__team--turn">
    <div class="score-strip__name">Fadderbarna</div>
    <div class="score-strip__score">1200</div>
  </div>
  <div class="score-strip__team">
    <div class="score-strip__name">Kollektivet</div>
    <div class="score-strip__score">800</div>
  </div>
  <div class="score-strip__team">
    <div class="score-strip__name">Team Bortistu</div>
    <div class="score-strip__score score-strip__score--negative">-300</div>
  </div>
  <div class="score-strip__team">
    <div class="score-strip__name">Kalinka</div>
    <div class="score-strip__score">400</div>
  </div>
  <div class="score-strip__team">
    <div class="score-strip__name">Siste Skanse</div>
    <div class="score-strip__score">0</div>
  </div>
</div>
</div></div></div>
</body>
</html>
