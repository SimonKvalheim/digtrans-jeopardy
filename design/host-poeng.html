<!-- @dsCard group="Vertspult" -->
<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>Vertspult — Poeng</title>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./frame.css">
</head>
<body>
<div class="ds-frame ds-frame--phone"><div class="phone host">
  <header class="host__header"><span class="host__code">NTNU</span></header>
  <main class="host__body"><div class="poeng">
  <div class="poeng__steps">
    <button class="chip">50</button>
    <button class="chip chip--active">100</button>
    <button class="chip">200</button>
    <button class="chip">400</button>
  </div>
  <ul class="poeng__teams">
    
    <li class="poeng__team">
      <div class="poeng__team-head">
        <span class="poeng__team-name">Fadderbarna</span>
        <span class="poeng__team-score">1200</span>
      </div>
      <div class="poeng__team-controls">
        <button class="btn btn--minus">−100</button>
        <button class="btn btn--plus">+100</button>
      </div>
    </li>
    <li class="poeng__team">
      <div class="poeng__team-head">
        <span class="poeng__team-name">Kollektivet</span>
        <span class="poeng__team-score">800</span>
      </div>
      <div class="poeng__team-controls">
        <button class="btn btn--minus">−100</button>
        <button class="btn btn--plus">+100</button>
      </div>
    </li>
    <li class="poeng__team">
      <div class="poeng__team-head">
        <span class="poeng__team-name">Team Bortistu</span>
        <span class="poeng__team-score poeng__team-score--negative">-300</span>
      </div>
      <div class="poeng__team-controls">
        <button class="btn btn--minus">−100</button>
        <button class="btn btn--plus">+100</button>
      </div>
    </li>
  </ul>
  <button class="btn btn--undo">↶ Angre (+400)</button>
</div></main>
  <nav class="host__tabs">
    <button class="host__tab">Brett</button><button class="host__tab">Spør</button><button class="host__tab host__tab--active">Poeng</button><button class="host__tab">Final</button>
  </nav>
</div></div>
</body>
</html>
