<!-- @dsCard group="Brett" -->
<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<title>Spørsmål</title>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./frame.css">
</head>
<body>
<div class="ds-frame ds-frame--board"><div class="stage"><div class="board">
<div class="clue">
  <div class="clue__header">
    <span>Trondheim & NTNU</span>
    <span class="clue__value"><span class="clue__value-label">Verdi</span>400</span>
  </div>
  
  <p class="clue__prompt">Hvilken elv renner gjennom byen?</p>
  
<div class="countdown">
  <div class="countdown__bar">
    <div class="countdown__fill" style="transform: scaleX(0.7)"></div>
  </div>
  <span class="countdown__seconds">21</span>
</div>
  <div class="clue__footer">
    <span class="clue__sips">8 slurker å prøve</span>
    <span>Kollektivet</span>
  </div>
</div>
<div class="score-strip">
  
  <div class="score-strip__team">
    <div class="score-strip__name">Fadderbarna</div>
    <div class="score-strip__score">1200</div>
  </div>
  <div class="score-strip__team score-strip__team--turn">
    <div class="score-strip__name">Kollektivet</div>
    <div class="score-strip__score">800</div>
  </div>
  <div class="score-strip__team">
    <div class="score-strip__name">Team Bortistu</div>
    <div class="score-strip__score score-strip__score--negative">-300</div>
  </div>
  <div class="score-strip__team">
    <div class="score-strip__name">Kalinka</div>
    <div class="score-strip__score">400</div>
  </div>
  <div class="score-strip__team">
    <div class="score-strip__name">Siste Skanse</div>
    <div class="score-strip__score">0</div>
  </div>
</div></div></div></div>
</body>
</html>
